interface:
  display_name: "Issue to PR Workflow"
  short_description: "Issue作成からPRレビューまでの開発フローを支援"
  default_prompt: "要望を状態契約に沿ってTaskへ分解し、PlanまたはIssueへscopeと依存を記録してください。Issue review後は親Agentが専用worktreeを準備し、利用可能なSubAgentだけへ委譲します。Git/GitHub操作は親Agentのeffect gateで対象・内容・権限を確認し、拒否時は実行せずblockedとして報告してください。"
